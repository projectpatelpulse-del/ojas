# Ojas stack on a single VPS (replace IP or add server_name when you attach a domain).
# Install: sudo cp nginx-ojas-ip.conf /etc/nginx/sites-available/ojas
#          sudo ln -sf /etc/nginx/sites-available/ojas /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Web roots expected (see install-vps.sh):
#   /var/www/ojas/ecom/    — ojas-ecom Flutter web (shop at /)
#   /var/www/ojas/admin/   — ojas-admin Flutter web
#   /var/www/ojas/vendor/  — ojas-vendor Flutter web

upstream ojas_node {
    server 127.0.0.1:5001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name 72.61.172.182;

    client_max_body_size 100M;

    # API (Express + JSON)
    location /api/ {
        proxy_pass http://ojas_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO (same Node process as server.js)
    location /socket.io/ {
        proxy_pass http://ojas_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Admin panel (Flutter web)
    location /admin/ {
        root /var/www/ojas;
        try_files $uri $uri/ /admin/index.html;
    }

    # Vendor panel (Flutter web)
    location /vendor/ {
        root /var/www/ojas;
        try_files $uri $uri/ /vendor/index.html;
    }

    # Storefront (Flutter web)
    location / {
        root /var/www/ojas/ecom;
        try_files $uri $uri/ /index.html;
    }
}
