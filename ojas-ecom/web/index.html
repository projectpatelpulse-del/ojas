  <script>
    window.openCashfreeCheckout = function(paymentSessionId, mode) {
      console.log("[Cashfree JS SDK] Initializing checkout with session ID:", paymentSessionId, "mode:", mode);
      try {
        const cashfree = Cashfree({
          mode: mode
        });
        cashfree.checkout({
          paymentSessionId: paymentSessionId,
          redirectTarget: "_self"
        });
      } catch (err) {
        console.error("[Cashfree JS SDK] Error:", err);
      }
    };
  </script>
